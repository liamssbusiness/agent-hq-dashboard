<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent HQ Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            background: #0a0a0a;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            border-bottom: 2px solid #00d4ff;
            padding: 20px;
            background: #000;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        .card {
            background: #1a1a2e;
            border: 3px solid #00d4ff;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }
        
        .card h2 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            border-radius: 6px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-box.agents {
            background: #0a3a0a;
            border: 1px solid #00ff41;
            color: #00ff41;
        }
        
        .stat-box.messages {
            background: #3a0a2a;
            border: 1px solid #ff006e;
            color: #ff006e;
        }
        
        .stat-box.flows {
            background: #3a2a0a;
            border: 1px solid #ffa500;
            color: #ffa500;
        }
        
        .stat-box.cost {
            background: #0a2a3a;
            border: 1px solid #0088ff;
            color: #0088ff;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }
        
        .agents-list {
            border-top: 1px solid #00d4ff;
            padding-top: 20px;
            font-size: 13px;
            line-height: 1.8;
            text-align: center;
        }
        
        .footer {
            border-top: 2px solid #00d4ff;
            padding: 15px;
            background: #000;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✓ Agent HQ Dashboard</h1>
            <p>Live Agent Network - Status: ONLINE</p>
        </div>
        
        <div class="main">
            <div class="card">
                <h2>✅ ONLINE</h2>
                
                <div class="stats">
                    <div class="stat-box agents">
                        <div class="stat-label">Active Agents</div>
                        <div class="stat-value">4/7</div>
                    </div>
                    <div class="stat-box messages">
                        <div class="stat-label">Messages</div>
                        <div class="stat-value">12</div>
                    </div>
                    <div class="stat-box flows">
                        <div class="stat-label">Flows</div>
                        <div class="stat-value">5</div>
                    </div>
                    <div class="stat-box cost">
                        <div class="stat-label">Cost</div>
                        <div class="stat-value">$0.52</div>
                    </div>
                </div>
                
                <div class="agents-list">
                    <div>🔵 Central Hub • 🟢 Code Lab • 🔴 Ads Studio</div>
                    <div>🟠 Trading • 🟣 Social • 🔵 Revify • 🟢 Learning</div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <span>7 Agents • 5 Active Flows • Status: ONLINE</span>
        </div>
    </div>
</body>
</html>
