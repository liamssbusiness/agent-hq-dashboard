<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Alfred</title>
<style>
  :root { --bg:#0a0a0f; --panel:#12121a; --cyan:#22d3ee; --txt:#e5e7eb; --dim:#7b8190; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:16px/1.5 -apple-system,system-ui,sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 18px; border-bottom:1px solid #1f1f2b; display:flex; align-items:center; gap:10px; }
  header b { color:var(--cyan); letter-spacing:.5px; }
  #budget { margin-left:auto; font-size:12px; color:var(--dim); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:#1d2b34; border:1px solid #244; }
  .alfred { align-self:flex-start; background:var(--panel); border:1px solid #222; }
  .meta { font-size:11px; color:var(--dim); margin-top:4px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #1f1f2b; }
  input,button { font:inherit; border-radius:12px; border:1px solid #2a2a3a; }
  input { flex:1; padding:12px 14px; background:#0f0f17; color:var(--txt); }
  button { padding:0 18px; background:var(--cyan); color:#001; font-weight:600; border:none; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
  <header><b>ALFRED</b> <span style="color:var(--dim);font-size:13px">your second brain</span>
    <span id="budget"></span></header>
  <div id="log"></div>
  <form id="f">
    <input id="t" placeholder="Talk to Alfred…" autocomplete="off" />
    <button id="b">Send</button>
  </form>
<script>
  // Set once per device: localStorage.alfredToken = "your ALFRED_ACCESS_TOKEN"
  const TOKEN = localStorage.getItem('alfredToken') || '';
  const log = document.getElementById('log');
  function add(text, who, meta) {
    const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = text;
    if (meta) { const m = document.createElement('div'); m.className='meta'; m.textContent=meta; d.appendChild(m); }
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }
  async function budget() {
    try { const r = await fetch('/budget',{headers:{Authorization:'Bearer '+TOKEN}});
      const j = await r.json(); document.getElementById('budget').textContent =
        '$'+j.spent_30d_usd.toFixed(2)+' / $'+j.monthly_budget_usd; } catch(e){}
  }
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const inp = document.getElementById('t'); const btn = document.getElementById('b');
    const text = inp.value.trim(); if (!text) return;
    add(text, 'user'); inp.value=''; btn.disabled=true;
    try {
      const r = await fetch('/chat', { method:'POST',
        headers:{'Content-Type':'application/json', Authorization:'Bearer '+TOKEN},
        body: JSON.stringify({ message:text, device: navigator.platform || 'web' }) });
      const j = await r.json();
      add(j.reply || ('['+(j.detail||'error')+']'), 'alfred', j.model);
      budget();
    } catch (err) { add('Connection error: '+err, 'alfred'); }
    btn.disabled=false; inp.focus();
  });
  budget();
</script>
</body>
</html>
